name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install lint tools
        run: pip install ruff==0.16.0

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Ban direct is_superuser authorization checks
        run: python -m auth_user_service.scripts.check_no_direct_superuser_auth auth_user_service examples/fastapi_full

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r auth_user_service/requirements_dev.txt
          pip install -r examples/fastapi_full/requirements_base.txt

      - name: Type check auth_user_service
        run: mypy auth_user_service --ignore-missing-imports

      - name: Type check fastapi_full
        run: mypy examples/fastapi_full --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (grade A — no MEDIUM/HIGH issues)
        run: bandit -r auth_user_service examples/fastapi_full --severity-level medium -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          pip-audit -r auth_user_service/requirements_dev.txt
          pip-audit -r examples/fastapi_full/requirements_base.txt

      - name: Trivy filesystem scan (CRITICAL/HIGH CVEs and secrets)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: auth_user_service/requirements_dev.txt

      - name: Install dependencies
        run: pip install -r auth_user_service/requirements_dev.txt

      - name: Create test .env
        run: |
          cat > auth_user_service/.env << 'ENVEOF'
          DOMAIN=localhost
          ENVIRONMENT=local
          PROJECT_NAME=fa-auth-m8
          STACK_NAME=fa-auth-m8
          API_PREFIX=/user
          BACKEND_HOST=http://localhost:8000
          FRONTEND_HOST=http://localhost:5173
          BACKEND_CORS_ORIGINS=http://localhost:8000,http://localhost:5173
          SELECTED_DB=Mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=test_db
          DB_USER=test_user
          DB_PASSWORD=CiTestDb_Passw0rd
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_USER=appuser
          REDIS_PASSWORD=CiTestRed_Passw0rd
          ACCESS_SECRET_KEY=CiTest-AccessKey-fa-auth2024-AbCdE
          REFRESH_SECRET_KEY=CiTest-RefreshKey-fa-auth2024-AbCd
          # auth-sdk-m8 >= 1.0.0 secure-by-default: this single-service CI run uses the
          # documented opt-out — HS256 symmetric keys + strict iss/aud off — plus a test
          # EVENT_SIGNING_KEY so the boot validators pass without RSA keys or a key store.
          ACCESS_TOKEN_ALGORITHM=HS256
          REFRESH_TOKEN_ALGORITHM=HS256
          TOKEN_STRICT_VALIDATION=false
          EVENT_SIGNING_KEY=CiTest-EventSigning-fa-auth2024-AbCd
          FIRST_SUPERUSER=ci-admin@example.com
          FIRST_SUPERUSER_PASSWORD=CiTestSup_Pass0rd
          PRIVATE_API_SECRET=CiTest-PrivateApi-fa-auth2024-AbCd
          SESSION_SECRET=CiTest-SessionSecret-fa-auth2024-AbCd
          TOKENS_ENCRYPTION_KEY=CiTest-TokensEnc-fa-auth2024-AbCd
          GOOGLE_CLIENT_ID=fake-ci-client.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=CiTest-GoogleSecret-fa-auth2024-AbCd
          ENVEOF

      - name: Run tests
        run: pytest --cov-report=xml --cov-fail-under=100

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          verbose: true

      - name: Upload coverage to Codacy
        if: matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  example-tests:
    name: Bundled-example unit tests (fastapi_full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r examples/fastapi_full/requirements_dev.txt

      # The example carries its own pytest config: it is a consumer service
      # with its own settings and package root, so it is not measured by the
      # issuer's --cov=auth_user_service gate. It carries its own coverage gate
      # too — examples/fastapi_full/.coveragerc names and justifies each
      # omission, and pytest.ini declares the enforced floor. Run from the
      # repository root, which is what the --cov-config path is relative to.
      # tests/conftest.py supplies a complete throwaway environment, so no .env
      # is needed here.
      - name: Run bundled-example unit tests
        run: pytest -c examples/fastapi_full/pytest.ini examples/fastapi_full/tests

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: auth_user_service/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: fa-auth-m8:ci-scan
          cache-from: type=gha

      - name: Trivy image scan (CRITICAL/HIGH CVEs — blocks PR on findings)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: image
          image-ref: fa-auth-m8:ci-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

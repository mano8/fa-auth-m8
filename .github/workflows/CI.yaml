name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install lint tools
        run: pip install ruff==0.16.0

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Ban direct is_superuser authorization checks
        run: python -m auth_user_service.scripts.check_no_direct_superuser_auth auth_user_service examples/fastapi_full

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r auth_user_service/requirements_dev.txt
          pip install -r examples/fastapi_full/requirements_base.txt

      - name: Type check auth_user_service
        run: mypy auth_user_service --ignore-missing-imports

      - name: Type check fastapi_full
        run: mypy examples/fastapi_full --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (grade A — no MEDIUM/HIGH issues)
        run: bandit -r auth_user_service examples/fastapi_full --severity-level medium -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          pip-audit -r auth_user_service/requirements_dev.txt
          pip-audit -r examples/fastapi_full/requirements_base.txt

      - name: Trivy filesystem scan (CRITICAL/HIGH CVEs and secrets)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: auth_user_service/requirements_dev.txt

      - name: Install dependencies
        run: pip install -r auth_user_service/requirements_dev.txt

      # The throwaway CI environment lives in tests/ci_env_fixture.txt — see the
      # header there for why it is a file rather than an inline heredoc.
      - name: Create test .env
        run: cp tests/ci_env_fixture.txt auth_user_service/.env

      - name: Run tests
        run: pytest --cov-report=xml --cov-fail-under=100

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          verbose: true

      - name: Upload coverage to Codacy
        if: matrix.python-version == '3.12' && github.actor != 'dependabot[bot]'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  example-tests:
    name: Bundled-example unit tests (fastapi_full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r examples/fastapi_full/requirements_dev.txt

      # The example carries its own pytest config: it is a consumer service
      # with its own settings and package root, so it is not measured by the
      # issuer's --cov=auth_user_service gate. It carries its own coverage gate
      # too — examples/fastapi_full/.coveragerc names and justifies each
      # omission, and pytest.ini declares the enforced floor. Run from the
      # repository root, which is what the --cov-config path is relative to.
      # tests/conftest.py supplies a complete throwaway environment, so no .env
      # is needed here.
      - name: Run bundled-example unit tests
        run: pytest -c examples/fastapi_full/pytest.ini examples/fastapi_full/tests

  test-shipped-lock:
    name: Tests against the shipped prod lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the shipped set exactly as the Dockerfile does
        run: pip install --require-hashes -r auth_user_service/requirements_prod.lock

      - name: Derive constraints from the lock
        run: python scripts/shipped_lock_env.py --emit-constraints lock-constraints.txt

      # PyYAML and hypothesis are test-only (the policy tests parse the workflow
      # and compose files; the property tests need hypothesis); the constraints
      # file keeps them from moving anything the image ships.
      - name: Add test tooling without moving the shipped set
        run: pip install -c lock-constraints.txt pytest pytest-cov coverage pyyaml hypothesis

      - name: Verify the environment is still the shipped set
        run: python scripts/shipped_lock_env.py --verify

      # The throwaway CI environment lives in tests/ci_env_fixture.txt — see the
      # header there for why it is a file rather than an inline heredoc.
      - name: Create test .env
        run: cp tests/ci_env_fixture.txt auth_user_service/.env

      - name: Run tests against the shipped set
        run: pytest --cov-fail-under=100 -p no:cacheprovider

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: auth_user_service/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: fa-auth-m8:ci-scan
          cache-from: type=gha

      - name: Trivy image scan (CRITICAL/HIGH CVEs — blocks PR on findings)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: image
          image-ref: fa-auth-m8:ci-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

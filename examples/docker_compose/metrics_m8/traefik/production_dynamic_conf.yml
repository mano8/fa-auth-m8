# production_dynamic_conf.yml — Production
# Copy to dynamic_conf.yml when deploying to a public-facing environment.
#
# Changes from the dev config:
#   1. security-headers-prod adds Content-Security-Policy and enables HSTS.
#   2. Replace "localhost" in Host rules with your actual FQDN (e.g., auth.example.com).
#   3. Update TLS section to use your real certificate paths or ACME resolver.
#
# HSTS WARNING: once enabled, browsers refuse plain HTTP to this host for
# stsSeconds. Only enable after TLS is stable and trusted.
tls:
  # options.default is applied automatically to every router that does not name
  # an explicit tls.options. Production raises the floor to TLS 1.3 — drop
  # minVersion to VersionTLS12 (with the cipherSuites below) only if you must
  # support older clients.
  options:
    default:
      minVersion: VersionTLS13
      cipherSuites:                    # only consulted for TLS 1.2 fallback; TLS 1.3 suites are fixed
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - X25519
        - CurveP256
  stores:
    default:
      defaultCertificate:
        certFile: "/etc/traefik/certs/local.crt"
        keyFile:  "/etc/traefik/certs/local.key"
  certificates:
    - certFile: "/etc/traefik/certs/local.crt"
      keyFile:  "/etc/traefik/certs/local.key"
http:

  routers:
    # Dashboard — localhost only: served on the built-in 'traefik' entrypoint
    # (127.0.0.1:8080), Host-pinned and IP-restricted, over TLS.
    # api.insecure is false, so this router is the ONLY way to reach api@internal.
    traefik-dashboard:
      entryPoints:
        - traefik
      rule: "Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      service: api@internal
      middlewares:
        - ip-allowlist
      tls: {}

    # Auth-User-Service: public API routes on HTTPS (health is public-shallow; metrics internal-only)
    # PRODUCTION: docs are disabled via ENVIRONMENT=production — no CSP/docs conflict.
    auth-public-router:
      entryPoints:
        - websecure
      # LOCALHOST-ONLY by default. PRODUCTION: replace `localhost` with your public
      # FQDN (e.g. Host(`auth.example.com`)) to serve real traffic, or delete the
      # `Host(...) && ` prefix to match any hostname/IP.
      # The path exclusions are the SECURITY CONTRACT and MUST stay regardless —
      # /user/metrics + /user/private are never publicly routable. /user/health is
      # public-shallow (its deep detail stays app-gated, fail-closed).
      rule: "Host(`localhost`) && PathPrefix(`/user`) && !(PathPrefix(`/user/metrics`) || PathPrefix(`/user/private`))"
      service: auth-service
      middlewares:
        - security-headers-prod
      tls: {}
      priority: 2

    # Auth-User-Service: all routes on the localhost-bound api entryPoint (port 9000)
    auth-internal-router:
      entryPoints:
        - api
      rule: "PathPrefix(`/user`)"
      service: auth-service
      middlewares:
        - security-headers-prod
        - internal-only

    # FastAPI-Service: public routes on HTTPS
    fastapi-public-router:
      entryPoints:
        - websecure
      # LOCALHOST-ONLY by default. PRODUCTION: replace `localhost` with your public
      # FQDN, or delete the `Host(...) && ` prefix to match any hostname/IP.
      rule: "Host(`localhost`) && PathPrefix(`/fastapi`)"
      service: fastapi-service
      middlewares:
        - security-headers-prod
      tls: {}

    # FastAPI-Service: all routes on the localhost-bound api entryPoint (port 9000)
    fastapi-internal-router:
      entryPoints:
        - api
      rule: "PathPrefix(`/fastapi`)"
      service: fastapi-service
      middlewares:
        - security-headers-prod
        - internal-only

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth_user_service:8000"
    fastapi-service:
      loadBalancer:
        servers:
          - url: "http://fastapi_full:8000"

  middlewares:
    ip-allowlist:
      IPAllowList:
        # Dashboard: localhost only (bridge gateway == host via SNAT). Sibling
        # containers and the LAN are not trusted. PRODUCTION: replace the gateway
        # below with your real management CIDR, or front the dashboard with auth.
        sourceRange:
          - "127.0.0.1/32"
          - "172.16.0.1/32"
          - "::1/128"

    internal-only:
      IPAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "172.16.0.0/16"
          - "::1/128"

    security-headers-prod:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        # HSTS: enable only after TLS is stable with a trusted certificate.
        # Once set, browsers enforce HTTPS for stsSeconds even if you later disable it.
        #stsSeconds: 63072000         # 2 years
        #stsIncludeSubdomains: true
        #stsPreload: false            # set true only after submitting to HSTS preload list
        #customResponseHeaders:
        #  Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'"
        #  X-Robots-Tag: "noindex,nofollow"
        #  Server: ""

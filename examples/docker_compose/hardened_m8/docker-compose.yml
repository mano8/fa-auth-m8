services:
  # One-shot cert generator: creates local.crt/local.key if they don't exist.
  # Traefik waits for this before starting. Skipped automatically when certs already exist.
  # For browser-trusted certs: install mkcert, then run: bash init.sh --rotate-certs
  cert-init:
    image: alpine:3.22
    volumes:
      - ./traefik/certs:/certs
    command:
      - sh
      - -c
      - |
        if [ -f /certs/local.crt ]; then
          echo "==> cert-init: certs found, skipping"; exit 0
        fi
        apk add --no-cache --quiet openssl
        openssl req -x509 -newkey rsa:2048 -nodes \
          -keyout /certs/local.key -out /certs/local.crt \
          -days 365 -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        chmod 600 /certs/local.key && chmod 644 /certs/local.crt
        echo "==> cert-init: self-signed cert ready (browsers will warn)"
        echo "    For trusted certs: mkcert -install, then bash init.sh --rotate-certs"
    restart: "no"

  traefik:
    image: traefik:v3.7.5
    ports:
      - "8000:80"
      - "4430:443/tcp"
      - "4430:443/udp"  # HTTP/3 / QUIC
      - "127.0.0.1:8080:8080"   # Dashboard — localhost only
      - "${API_BIND_IP:-127.0.0.1}:9000:9000"   # services entryPoint — override API_BIND_IP for LAN/public exposure
    # No Docker socket mount: the hardened stack routes exclusively through the
    # Traefik file provider (traefik/dynamic_conf.yml). Mounting /var/run/docker.sock
    # — even read-only — grants the Docker API, which is equivalent to host root.
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app_net

  m8_db:
    image: postgres:18.4-alpine
    volumes:
      - ./db_data:/var/lib/postgresql
      - ../shared/db_init:/docker-entrypoint-initdb.d:ro
    env_file:
      - ./.env                          # exposes all .env vars so init-db.sh can discover DB triplets
    environment:
      - POSTGRES_USER=${DB_USER}        # engine bootstrap — required by the official postgres image
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGPORT=${DB_PORT}
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${DB_PORT} -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot only: the official entrypoint runs initdb + the init-db.sh
      # provisioning on the Unix socket with TCP disabled, so pg_isready over
      # 127.0.0.1 cannot pass until that completes. On a slow (e.g. Windows)
      # bind mount under full-stack build load this can exceed 80s, tripping the
      # old 30s window and failing dependents. A long start_period covers the
      # cold init; start_interval probes every 2s so warm restarts flip healthy
      # immediately (start_period ends the moment a probe succeeds).
      start_period: 180s
      start_interval: 2s
    restart: unless-stopped
    networks:
      - data_net

  redis_cache:
    image: redis:8.8.0-alpine
    volumes:
      - ./redis/redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    command:
      - sh
      - -c
      - |
        redis-server --save 20 1 --loglevel warning --requirepass "${REDIS_PASSWORD}" &
        until redis-cli ping 2>/dev/null | grep -q PONG; do sleep 0.2; done
        # Per-service scoped ACL (plan 6.x.1): the auth app authenticates as
        # `auth`, restricted to its own key prefixes and only the command
        # categories it uses (read/write strings+hashes, pipelined txns, the
        # refresh-rotation Lua EVAL, connection handshake; dangerous/admin
        # denied). The default user is then stripped of all data/admin access
        # — it keeps only connection commands so the healthcheck PING works.
        redis-cli ACL SETUSER auth on \>"${REDIS_PASSWORD}" "~oauth_session:*" "~auth_code:*" "~login:*" "~refresh:*" "~exchange:*" "~rt:*" "~jwt:blacklist:*" "~rate:*" "~api_key:*" "~introspect:*" "~security:*" +@read +@write +@transaction +@connection +eval -@dangerous "+client|setinfo"
        redis-cli ACL SETUSER default on \>"${REDIS_PASSWORD}" resetkeys -@all +@connection -@dangerous
        wait
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data_net

  prometheus:
    image: ubuntu/prometheus:3.11-26.04_stable
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app_net
    restart: unless-stopped

  # One-shot host-path owner fixes. Both bind-mount targets below are written by
  # containers that deliberately run as a non-root uid, and Docker creates a
  # missing bind-mount source as root:root, so on a Linux engine neither service
  # can write its own directory. Docker Desktop on macOS/Windows ignores
  # bind-mount ownership, which is why this only bites on Linux (including CI).

  # auth_user_service runs as appuser (uid 1000). This example ships no
  # pre-generated migrations, so the entrypoint generates them into the mounted
  # ./shared_migrations and otherwise dies with
  # "PermissionError: '/opt/shared_migrations/auth_user'".
  migrations-init:
    image: alpine:3.22
    volumes:
      - ./shared_migrations:/opt/shared_migrations
    command:
      - sh
      - -c
      - |
        set -e
        chown -R 1000:1000 /opt/shared_migrations
        chmod -R u+rwX,g+rwX /opt/shared_migrations
        echo "==> migrations-init: shared_migrations owned by uid 1000, writable by all m8 services"
    # Handing a directory to another uid inherently requires CAP_CHOWN, so this
    # one-shot runs as root — but CAP_CHOWN (plus what it needs to read and
    # re-run over an already-converted directory) is the *only* privilege it
    # keeps: no network, read-only root filesystem, no privilege escalation,
    # exactly one bind-mounted directory, and it exits before any service starts.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    network_mode: "none"
    read_only: true
    restart: "no"

  # grafana/grafana declares USER 472:0; without this it crash-loops on
  # "GF_PATHS_DATA='/var/lib/grafana' is not writable". Prometheus needs no
  # equivalent: its image runs as root and self-manages.
  grafana-init:
    image: alpine:3.22
    volumes:
      - ./grafana/data:/grafana_data
    command:
      - sh
      - -c
      - |
        set -e
        chown -R 472:0 /grafana_data
        chmod -R u+rwX,g+rwX /grafana_data
        echo "==> grafana-init: /grafana_data owned by grafana (472:0)"
    # Handing a directory to another uid inherently requires CAP_CHOWN, so this
    # one-shot runs as root — but CAP_CHOWN (plus what it needs to read and
    # re-run over an already-converted directory) is the *only* privilege it
    # keeps: no network, read-only root filesystem, no privilege escalation,
    # exactly one bind-mounted directory, and it exits before Grafana starts.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    network_mode: "none"
    read_only: true
    restart: "no"

  grafana:
    image: grafana/grafana:13.1.0-25530058790
    depends_on:
      prometheus:
        condition: service_started
      grafana-init:
        condition: service_completed_successfully
    env_file:
      - ./grafana.env
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app_net
    restart: unless-stopped

  auth_user_service:
    image: tepochtli/fa-auth-m8:2.0.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    env_file:
      - ./auth.env
    volumes:
      - ./auth.env:/opt/auth_user_service/.env:ro
      - ./shared_migrations:/opt/shared_migrations
      - ./keys:/opt/keys:ro
    depends_on:
      migrations-init:
        condition: service_completed_successfully
      m8_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/user/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_net
      - data_net

  fastapi_full:
    build:
      context: ../../
      dockerfile: ./fastapi_full/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    env_file:
      - ./api.env
    volumes:
      - ../../fastapi_full:/opt/fastapi_full
      - ./api.env:/opt/fastapi_full/.env:ro
      - ./shared_migrations:/opt/shared_migrations
    depends_on:
      m8_db:
        condition: service_healthy
      auth_user_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/fastapi/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_net
      - data_net

# app_net: external-facing — Traefik, app services, observability.
# data_net: internal only (no gateway) — DB and Redis are not reachable from app_net.
# App services sit on both networks; Traefik sits on app_net only and cannot reach DB/Redis.
networks:
  app_net:
    driver: bridge
    name: hardened_m8_app_net   # explicit name so Traefik's network: setting can reference it
    # Pinned, deterministic subnet so the bridge gateway IP is stable and the
    # allowlists in traefik/dynamic_conf.yml can trust it. 172.16.0.0/16 is RFC1918
    # private space Docker allocates per-bridge on ANY host, independent of the
    # machine's own LAN — portable, NOT tied to this machine. Host->published-port
    # traffic is SNATed to the gateway (172.16.0.1), trusted as "localhost" by the
    # dashboard allowlist; sibling containers keep 172.16.0.x and are NOT trusted.
    # If 172.16.0.0/16 is already in use on a host (e.g. a corporate VPN), change
    # both lines below and the matching CIDRs in traefik/dynamic_conf.yml.
    ipam:
      config:
        - subnet: 172.16.0.0/16
          gateway: 172.16.0.1
  data_net:
    driver: bridge
    internal: true   # no gateway — DB/Redis are unreachable from app_net or the host

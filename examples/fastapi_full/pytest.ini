; Run from the repository root:
;   pytest -c examples/fastapi_full/pytest.ini examples/fastapi_full/tests
; The --cov-config path below is resolved against the working directory, so the
; repository root is the supported invocation — the same one CI.yaml uses.
[pytest]
pythonpath = ..
testpaths = tests
markers =
    unit: Pure unit tests — no network, no Docker, runs in CI on every PR
addopts =
    --strict-markers
    --cov
    --cov-config=examples/fastapi_full/.coveragerc
    --cov-report=term-missing
    --cov-fail-under=95
